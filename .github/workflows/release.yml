name: Release

on:
  push:
    # X.Y.Z with an optional suffix (the cyrius init template's filter). A
    # stray tag that only starts with a digit does not start a release.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

# Read-only by default. Only the release job, which publishes, gets
# contents: write, so the CI gate it calls never holds a write token.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to a full commit SHA, as in ci.yml. persist-credentials false:
      # git archive needs no token, and the curl | sh installer below runs in
      # this job, which holds contents: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyml: $CYML_RAW)"

      - name: Install Cyrius toolchain
        # Same upstream install.sh form as CI: version read from cyrius.cyml's
        # [package].cyrius pin (never hardcoded).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        run: cyrius deps

      - name: Build smoke (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/akshara
          echo "akshara smoke: $(wc -c < build/akshara) bytes"

      - name: Regenerate bundle
        # `cyrius distlib` reads [lib].modules (src/tok.cyr) from cyrius.cyml
        # and writes dist/akshara.cyr with the version header stamped from
        # VERSION. CI's drift check already proved the committed bundle is in
        # sync; regenerating here ships freshly built bytes.
        run: cyrius distlib

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          rm -f akshara-*.tar.gz akshara-*.cyr
          git archive --format=tar.gz --prefix="akshara-${TAG}/" -o "akshara-${TAG}-src.tar.gz" HEAD
          # Ship the distlib bundle as a standalone, version-stamped asset —
          # consumers import it via [deps.akshara] modules = ["dist/akshara.cyr"].
          cp dist/akshara.cyr "akshara-${TAG}.cyr"
          sha256sum akshara-*.tar.gz akshara-*.cyr build/akshara > SHA256SUMS

      - name: Extract changelog
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          [ -s /tmp/body.md ] || echo "No changelog entry for ${GITHUB_REF_NAME}." > /tmp/body.md

      # The one step that uses the write token, so a moved tag here could rewrite
      # what a release ships: pinned to a full commit SHA (the tag's ^{} commit,
      # checked with git ls-remote).
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "akshara ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            akshara-*.tar.gz
            akshara-*.cyr
            build/akshara
            SHA256SUMS
